<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF7F0">
<title>토닥플레이 홈페이지 구성 설문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand"><img src="designs/assets/logo.png" alt="">토닥플레이 홈페이지 구성 설문</span>
    <span id="counter" class="count"></span>
  </header>
  <div class="bar"><div id="barFill" class="bar-fill"></div></div>

  <main id="stage" class="stage" aria-live="polite"></main>

  <footer id="nav" class="nav" hidden>
    <button id="prev" class="btn btn-ghost" type="button">이전</button>
    <button id="next" class="btn btn-primary" type="button">다음</button>
  </footer>

  <div id="overlay" class="overlay" aria-hidden="true">
    <span class="ov-shapes"><i class="s s1"></i><i class="s s2"></i><i class="s s3"></i></span>
    <span id="ovNum" class="ov-num">01</span>
    <span class="ov-rule"></span>
    <span id="ovTitle" class="ov-title"></span>
    <span id="ovSub" class="ov-sub"></span>
  </div>

  <div id="viewer" class="viewer" hidden>
    <div class="viewer-bar"><span id="viewerTitle"></span><button id="viewerClose" class="btn btn-ghost" type="button">닫기</button></div>
    <div class="viewer-body"><img id="viewerImg" alt=""></div>
  </div>
</div>
<script src="config.js?v=1"></script>
<script src="data.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
